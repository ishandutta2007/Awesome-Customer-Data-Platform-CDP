<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accent-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="grid-glow" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".1"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g opacity=".6"><path stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200"/><path stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M150,0 V300 M300,0 V300 M450,0 V300 M600,0 V300 M750,0 V300 M900,0 V300 M1050,0 V300"/><path fill="none" stroke="url(#accent-cyan)" stroke-width="3" d="M-100,220 Q 200,100 500,210 T 1100,180 T 1300,250" filter="url(#glow)" opacity=".4"><animate attributeName="d" dur="10s" repeatCount="indefinite" values="M-100,220 Q 200,100 500,210 T 1100,180 T 1300,250; M-100,200 Q 250,240 550,150 T 1050,220 T 1300,190; M-100,220 Q 200,100 500,210 T 1100,180 T 1300,250"/></path><path fill="none" stroke="