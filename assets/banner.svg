<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Dynamic Elements in Background (Pulsing Orbit Nodes & Glowing Data Streams) -->
  <g opacity="0.6">
    <!-- Grid Overlay -->
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    <path d="M150,0 V300 M300,0 V300 M450,0 V300 M600,0 V300 M750,0 V300 M900,0 V300 M1050,0 V300" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

    <!-- Dynamic Flow Waves (Background Layer) -->
    <path d="M-100,220 Q 200,100 500,210 T 1100,180 T 1300,250" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.4" filter="url(#glow)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M-100,220 Q 200,100 500,210 T 1100,180 T 1300,250;
                M-100,200 Q 250,240 550,150 T 1050,220 T 1300,190;
                M-100,220 Q 200,100 500,210 T 1100,180 T 1300,250" />
    </path>
    
    <path d="M-100,120 Q 300,260 650,120 T 1150,140" fill="none" stroke="url(#accent-purple)" stroke-width="2" opacity="0.5" filter="url(#glow)">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M-100,120 Q 300,260 650,120 T 1150,140;
                M-100,150 Q 350,90 600,200 T 1150,110;
                M-100,120 Q 300,260 650,120 T 1150,140" />
    </path>

    <!-- Animated Data Particles -->
    <circle cx="150" cy="180" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="0;1200" />
      <animate attributeName="cy" dur="8s" repeatCount="indefinite" values="180;120;220;180" />
    </circle>
    <circle cx="400" cy="240" r="5" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cx" dur="12s" repeatCount="indefinite" values="0;1200" />
      <animate attributeName="cy" dur="12s" repeatCount="indefinite" values="240;160;250;240" />
    </circle>
    <circle cx="800" cy="90" r="3.5" fill="#f472b6" filter="url(#glow)">
      <animate attributeName="cx" dur="10s" repeatCount="indefinite" values="1200;0" />
    </circle>
  </g>

  <!-- Geometric Abstract Node Elements (Right Side Decorative Graphics) -->
  <g transform="translate(920, 150)" opacity="0.85">
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#accent-purple)" stroke-width="1.5" stroke-dasharray="6,6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#accent-cyan)" stroke-width="1.5" stroke-dasharray="10,4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="40" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#glow)" />
    <!-- Center Icon Symbol (Data Hub) -->
    <path d="M-12,-12 L12,-12 L12,12 L-12,12 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#ec4899" />
  </g>

  <!-- Foreground Text Content (Ensured Clear Contrast & Readability) -->
  <g transform="translate(80, 0)">
    <!-- Subtitle Badge / Pill -->
    <g transform="translate(0, 50)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.5">
        AWESOME CUSTOMER DATA PLATFORM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5" filter="url(#soft-glow)">
      Awesome Customer Data Platform (CDP)
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      A curated list of top Enterprise SaaS products &amp; Open-Source CDP frameworks
    </text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 205)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#7dd3fc">
        ⚡ Identity Resolution
      </text>

      <!-- Chip 2 -->
      <rect x="177" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#9333ea" stroke-width="1" />
      <text x="189" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c084fc">
        🎯 Data Activation
      </text>

      <!-- Chip 3 -->
      <rect x="349" y="0" width="175" height="28" rx="6" fill="#0f172a" stroke="#db2777" stroke-width="1" />
      <text x="361" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#f472b6">
        🔓 Warehouse-Native
      </text>
    </g>
  </g>
</svg>
